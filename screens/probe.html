<title>hub 接続の試験</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* layout: 1カラム。上から「接続の状態」「読み取り」「書き込み」の3段。色は設計資料と同じ役割(作業=青 / 人の承認=橙) */
:root{--bg:#F5F7FA;--surface:#FFFFFF;--ink:#1A2330;--muted:#5A6676;--line:#D8DEE7;--task:#2C56C9;--task-bg:#E6ECFB;--ok:#0C7A72;--ok-bg:#DEF3F0;--warn:#A85A08;--warn-bg:#FBEBD5;
  --font:"Hiragino Sans","Yu Gothic UI","Yu Gothic",system-ui,sans-serif;--mono:ui-monospace,Consolas,monospace}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#11151B;--surface:#192029;--ink:#E5EAF1;--muted:#9BA6B5;--line:#2D3744;--task:#86A6FF;--task-bg:#1E2B4D;--ok:#56CBC0;--ok-bg:#12373A;--warn:#EDAA58;--warn-bg:#3D2A12}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#11151B;--surface:#192029;--ink:#E5EAF1;--muted:#9BA6B5;--line:#2D3744;--task:#86A6FF;--task-bg:#1E2B4D;--ok:#56CBC0;--ok-bg:#12373A;--warn:#EDAA58;--warn-bg:#3D2A12}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.8;padding-block:32px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
h1{font-size:24px;line-height:1.4;margin:0;text-wrap:balance}h2{font-size:17px;margin:0}
p{margin:0}.sub{color:var(--muted);font-size:14px}
section{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.badge{display:inline-block;border-radius:4px;padding:0 8px;font-size:13px;line-height:1.8;white-space:nowrap}
.badge.ok{background:var(--ok-bg);color:var(--ok)}.badge.warn{background:var(--warn-bg);color:var(--warn)}.badge.wait{background:var(--task-bg);color:var(--task)}
ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
li{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:6px;font-size:15px}
li:first-child{border-top:0;padding-top:0}
.id{font-family:var(--mono);font-size:13px;color:var(--muted);white-space:nowrap}
form{display:flex;gap:8px;flex-wrap:wrap}
input{flex:1 1 240px;min-width:0;font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
button{font:inherit;color:var(--surface);background:var(--task);border:0;border-radius:8px;padding:8px 18px;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible{outline:2px solid var(--task);outline-offset:2px}
.msg{font-size:14px;overflow-wrap:anywhere}
</style>

<main>
  <header>
    <p class="sub">開発基盤 / アーティファクトからローカルの MCP を呼べるかの試験</p>
    <h1>hub 接続の試験</h1>
  </header>

  <section>
    <h2>接続の状態 <span id="conn" class="badge wait">確認中</span></h2>
    <p id="conn-msg" class="msg sub">この画面を開いている Claude のアプリを通じて、手元の hub の MCP を探しています。</p>
  </section>

  <section>
    <h2>読み取り <span id="read" class="badge wait">待機中</span></h2>
    <p class="sub">進行中の作業と、未着手の ToDo を hub から読みます。</p>
    <ul id="tasks"></ul>
    <ul id="todos"></ul>
    <p id="read-msg" class="msg sub"></p>
  </section>

  <section>
    <h2>書き込み <span id="write" class="badge wait">未実行</span></h2>
    <p class="sub">ToDo を1件足します。足したあと、上の一覧を読み直します。</p>
    <form id="add">
      <input id="text" name="text" placeholder="ToDo の内容" autocomplete="off" required>
      <button id="go" type="submit" disabled>足す</button>
    </form>
    <p id="write-msg" class="msg sub"></p>
  </section>
</main>

<script>
const SERVER = 'host:hub';
const $ = (id) => document.getElementById(id);
const badge = (id, cls, text) => { const b = $(id); b.className = `badge ${cls}`; b.textContent = text; };

// エラーの種類ごとに、次にやることを変える。
function explain(e) {
  const c = e && e.code;
  if (c === 'server_not_connected') return 'hub の MCP が見つかりません。Claude のデスクトップアプリでこの画面を開いているか、アプリの設定に hub の MCP が入っているかを確かめてください。';
  if (c === 'not_in_manifest') return 'この画面には、hub の MCP を使う許可が出ていません。アーティファクトの許可の設定で hub を有効にしてください。';
  if (c === 'not_granted' || c === 'capability_disabled' || c === 'capability_removed') return 'この表示では MCP を使えません。';
  if (c === 'approval_required') return 'この操作には、あなたの承認が要ります。';
  if (c === 'cancelled') return '確認の画面で取り消されました。実行していません。';
  if (c === 'tool_error') return `hub がエラーを返しました: ${e.message}`;
  if (c === 'server_unavailable') return 'hub の MCP が応答しませんでした。少し待って読み直してください。';
  return `失敗しました(${c || '不明'}): ${(e && e.message) || ''}`;
}

function renderList(id, rows, empty) {
  const ul = $(id); ul.replaceChildren();
  if (!rows.length) { const li = document.createElement('li'); li.className = 'sub'; li.textContent = empty; ul.append(li); return; }
  for (const [idText, body] of rows) {
    const li = document.createElement('li');
    const a = document.createElement('span'); a.className = 'id'; a.textContent = idText;
    const b = document.createElement('span'); b.textContent = body;
    li.append(a, b); ul.append(li);
  }
}

let mcp = null;
async function load() {
  badge('read', 'wait', '読み込み中');
  try {
    const [tasks, todos] = await Promise.all([
      mcp.callTool(SERVER, 'task_list', {}, { cache: false }),
      mcp.callTool(SERVER, 'todo_list', {}, { cache: false }),
    ]);
    const ts = Array.isArray(tasks.payload) ? tasks.payload : [];
    const ds = Array.isArray(todos.payload) ? todos.payload : [];
    renderList('tasks', ts.map((t) => [t.id, `[${t.status}] ${t.title}`]), '作業はありません');
    renderList('todos', ds.map((d) => [d.id, d.text]), '未着手の ToDo はありません');
    badge('read', 'ok', '成功');
    $('read-msg').textContent = `作業 ${ts.length} 件、ToDo ${ds.length} 件を読みました。`;
  } catch (e) {
    badge('read', 'warn', '失敗');
    $('tasks').replaceChildren(); $('todos').replaceChildren();
    $('read-msg').textContent = explain(e);
  }
}

$('add').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const text = $('text').value.trim();
  if (!text || !mcp) return;
  $('go').disabled = true; badge('write', 'wait', '実行中');
  $('write-msg').textContent = 'アプリが確認を求めた場合は、そちらで答えてください。';
  try {
    const r = await mcp.callTool(SERVER, 'todo_add', { text });
    badge('write', 'ok', '成功');
    $('write-msg').textContent = `足しました: ${typeof r.payload === 'string' ? r.payload : JSON.stringify(r.payload)}`;
    $('text').value = '';
    await load();
  } catch (e) {
    // 応答が無かった場合は、書けたかどうか分からない。自動ではやり直さず、一覧を読み直して確かめる。
    badge('write', 'warn', e && e.code === 'cancelled' ? '取り消し' : '失敗');
    $('write-msg').textContent = explain(e);
    if (e && (e.code === 'server_unavailable' || e.code === 'upstream_error')) await load();
  } finally { $('go').disabled = false; }
});

(async () => {
  mcp = await (window.claude && window.claude.use ? window.claude.use('mcp') : null);
  if (!mcp) {
    badge('conn', 'warn', '使えません');
    $('conn-msg').textContent = 'この表示では MCP を使えません。Claude のデスクトップアプリで開いてください。';
    badge('read', 'warn', '未実行');
    return;
  }
  try {
    const list = await mcp.listTools(SERVER);
    const s = list.servers.find((x) => x.server === SERVER);
    if (!s) throw { code: 'server_not_connected' };
    badge('conn', 'ok', '見つかりました');
    $('conn-msg').textContent = `hub の MCP が見つかりました。使える道具: ${s.tools.map((t) => t.name).join('、')}`;
    $('go').disabled = false;
    await load();
  } catch (e) {
    badge('conn', 'warn', '見つかりません');
    $('conn-msg').textContent = explain(e);
    badge('read', 'warn', '未実行');
  }
})();
</script>
